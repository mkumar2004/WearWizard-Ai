<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Snowflake main lines -->
  <line x1="50" y1="15" x2="50" y2="85" stroke="#87CEEB" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="15" y1="50" x2="85" y2="50" stroke="#87CEEB" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="25" y1="25" x2="75" y2="75" stroke="#87CEEB" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="75" y1="25" x2="25" y2="75" stroke="#87CEEB" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Snowflake branches -->
  <line x1="50" y1="20" x2="45" y2="25" stroke="#B0E0E6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="20" x2="55" y2="25" stroke="#B0E0E6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="80" x2="45" y2="75" stroke="#B0E0E6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="80" x2="55" y2="75" stroke="#B0E0E6" stroke-width="2.5" stroke-linecap="round"/>
  
  <line x1="20" y1="50" x2="25" y2="45" stroke="#B0E0E6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="50" x2="25" y2="55" stroke="#B0E0E6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="75" y2="45" stroke="#B0E0E6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="75" y2="55" stroke="#B0E0E6" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Snowflake decorations -->
  <circle cx="50" cy="15" r="5" fill="#B0E0E6"/>
  <circle cx="50" cy="85" r="5" fill="#B0E0E6"/>
  <circle cx="15" cy="50" r="5" fill="#B0E0E6"/>
  <circle cx="85" cy="50" r="5" fill="#B0E0E6"/>
  <circle cx="25" cy="25" r="5" fill="#B0E0E6"/>
  <circle cx="75" cy="75" r="5" fill="#B0E0E6"/>
  <circle cx="75" cy="25" r="5" fill="#B0E0E6"/>
  <circle cx="25" cy="75" r="5" fill="#B0E0E6"/>
  
  <!-- Center crystal -->
  <circle cx="50" cy="50" r="6" fill="#E0FFFF" stroke="#87CEEB" stroke-width="2"/>
</svg>